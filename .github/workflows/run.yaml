name: Run Daily Podcast

on:
  schedule:
    - cron: "0 22 * * *" # 日本時間 07:00
  workflow_dispatch:
    inputs:
      date:
        description: "日付 (YYYY-MM-DD形式、空欄で前日)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set target date
        id: target_date
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "date=${{ inputs.date }}" >> $GITHUB_OUTPUT
          else
            DATE=$(TZ=Asia/Tokyo date -d "yesterday" +%F)
            echo "date=$DATE" >> $GITHUB_OUTPUT
          fi

      - name: Run Bot
        env:
          PODCAST_DATE: ${{ steps.target_date.outputs.date }}
        run: |
          docker compose up --build --abort-on-container-exit

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Upload to orphan branch
        run: |
          BRANCH="podcast-files"
          DATE="${{ steps.target_date.outputs.date }}"
          MP3_FILE="output/hackernews_${DATE}_podcast.mp3"

          if [ ! -f "$MP3_FILE" ]; then
            echo "MP3 file not found: $MP3_FILE"
            exit 1
          fi

          git fetch origin $BRANCH || true

          if git show-ref --verify --quiet refs/remotes/origin/$BRANCH; then
            git checkout $BRANCH
          else
            git checkout --orphan $BRANCH
            git rm -rf . || true
          fi

          mkdir -p public
          cp "$MP3_FILE" public/

          git add public/
          git commit -m "Add podcast: hackernews_${DATE}_podcast.mp3" || echo "No changes to commit"
          git push origin $BRANCH
