name: Run Daily Podcast

on:
  schedule:
    - cron: "0 22 * * *" # 日本時間 07:00
  workflow_dispatch:
    inputs:
      date:
        description: "日付 (YYYY-MM-DD形式、空欄で前日)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set target date
        id: target_date
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "date=${{ inputs.date }}" >> $GITHUB_OUTPUT
          else
            DATE=$(TZ=Asia/Tokyo date -d "yesterday" +%F)
            echo "date=$DATE" >> $GITHUB_OUTPUT
          fi

      - name: Run Bot
        env:
          PODCAST_DATE: ${{ steps.target_date.outputs.date }}
          PODCAST_OUTPUT_DIR: ./output
          PODCAST_UPLOAD: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          docker run --rm \
            -e PODCAST_DATE \
            -e PODCAST_OUTPUT_DIR=/app/output \
            -e PODCAST_UPLOAD \
            -e GITHUB_REPOSITORY \
            -v $(pwd)/output:/app/output \
            ghcr.io/${{ github.repository_owner }}/hackernews-podcast:latest

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Upload to orphan branch
        run: |
          BRANCH="podcast-files"
          DATE="${{ steps.target_date.outputs.date }}"
          MP3_FILE="output/hackernews_${DATE}_podcast.mp3"

          if [ ! -f "$MP3_FILE" ]; then
            echo "MP3 file not found: $MP3_FILE"
            exit 1
          fi

          git fetch origin $BRANCH || true

          if git show-ref --verify --quiet refs/remotes/origin/$BRANCH; then
            git checkout $BRANCH
          else
            git checkout --orphan $BRANCH
            git rm -rf . || true
          fi

          mkdir -p public
          cp "$MP3_FILE" public/

          git add public/
          git commit -m "Add podcast: hackernews_${DATE}_podcast.mp3" || echo "No changes to commit"
          git push origin $BRANCH
